<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>泡芙在门后</title>
    <style>
        :root {
            --bg: #f6efe6;
            --line: #6f4c38;
            --door: #ead2bd;
            --frame: #d7b398;
            --ink: #8a6954
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%
        }

        body {
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--line);
            background: radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .6), transparent 24%), linear-gradient(145deg, #f7f0e8, #efe3d5)
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            opacity: .18;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(111, 76, 56, .02) 0 1px, transparent 1px 4px)
        }

        .page {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            transition: .65s
        }

        .page.leaving {
            opacity: 0;
            transform: scale(1.025)
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-1vh)
        }

        .scene {
            position: relative;
            width: 300px;
            height: 430px;
            cursor: pointer;
            filter: drop-shadow(0 18px 22px rgba(91, 61, 42, .14));
            -webkit-tap-highlight-color: transparent
        }

        .inside {
            position: absolute;
            z-index: 1;
            left: 26px;
            top: 25px;
            width: 248px;
            height: 382px;
            border: 5px solid var(--line);
            border-radius: 130px 130px 16px 16px;
            overflow: hidden;
            background: #ffffff;
        }

        /* 半开门：Puff_lean.png。
           图层位于 door 与 frame 之间；图片尺寸与 Puff_inside 统一为 230px。
           动画终点不完全进入，只露出约半个头。 */
        .puff-peek {
            position: absolute;
            left: 202px;
            top: 250px;
            width: 83px;
            height: 132px;
            overflow: hidden;
            z-index: 3;
            opacity: 0;
            transform: translateX(-48px);
            animation: peek 5s ease-in-out infinite;
            pointer-events: none;
        }

        .puff-peek-img {
            position: absolute;
            width: 230px;
            max-width: none;
            left: -110px;
            top: -48px;
            display: block;
            transform: rotate(28deg);
            transform-origin: center center;
        }

        /* 完全开门：独立图层，直接相对 .scene 定位 */
        .puff-open {
            position: absolute;
            left: 26px;
            top: 25px;
            width: 248px;
            height: 382px;
            overflow: hidden;
            border-radius: 130px 130px 16px 16px;
            z-index: 3;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-42px);
            pointer-events: none;
            will-change: transform, opacity;
        }

        .puff-open-img {
            position: absolute;
            width: 250px;
            max-width: none;
            left: 9px;
            bottom: -2px;
            display: block;
        }

.door {
            position: absolute;
            left: 31px;
            top: 30px;
            width: 238px;
            height: 372px;
            z-index: 4;
            transform-origin: left center;
            border: 5px solid var(--line);
            border-radius: 122px 122px 13px 13px;
            background: linear-gradient(90deg, rgba(255, 255, 255, .18), transparent 28%), var(--door);
            animation: doorpeek 5s ease-in-out infinite;
            backface-visibility: hidden
        }

        .door:before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 4px solid rgba(111, 76, 56, .78);
            border-radius: 104px 104px 9px 9px
        }

        .knob {
            position: absolute;
            right: 19px;
            top: 53%;
            width: 17px;
            height: 17px;
            border: 3px solid var(--line);
            border-radius: 50%;
            background: #c58d65
        }

        .frame {
            position: absolute;
            inset: 0;
            border: 6px solid var(--line);
            border-radius: 155px 155px 20px 20px;
            box-shadow: inset 0 0 0 13px var(--frame), inset 0 0 0 18px var(--line);
            pointer-events: none;
            z-index: 2
        }

        .hint {
            margin: 24px 0 0;
            min-height: 36px;
            padding: 4px 12px 7px;
            font-size: clamp(18px, 4.8vw, 22px);
            letter-spacing: .12em;
            color: var(--ink);
            opacity: 0;
            transform: translateY(8px);
            transition: .75s;
            position: relative
        }

        .hint.show {
            opacity: 1;
            transform: none
        }

        .hint:after {
            content: "";
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: 0;
            height: 2px;
            background: rgba(111, 76, 56, .18);
            border-radius: 99px
        }

        @keyframes doorpeek {
            0% {
                transform: perspective(900px) rotateY(0)
            }

            8%,
            50% {
                transform: perspective(900px) rotateY(-15deg)
            }

            60%,
            100% {
                transform: perspective(900px) rotateY(0)
            }
        }

        @keyframes peek {

            0%,
            8% {
                opacity: 0;
                transform: translateX(-48px)
            }

            18%,
            50% {
                opacity: 1;
                transform: translateX(19.5px)
            }

            60%,
            100% {
                opacity: 0;
                transform: translateX(-48px)
            }
        }

        .scene.open .door {
            animation: none;
            transition: transform .9s cubic-bezier(.22, .75, .18, 1);
            transform: perspective(900px) rotateY(-72deg)
        }

        .scene.open .puff-peek {
            animation: none;
            opacity: 0;
            transform: translateX(-32px);
            transition: opacity .15s ease, transform .2s ease;
        }

        .scene.open .puff-open {
            visibility: visible;
            opacity: 1;
            transform: translateX(0);
            transition: opacity .25s ease .32s, transform .55s cubic-bezier(.22, .75, .18, 1) .32s;
        }
@media(max-width:430px) {
            .scene {
                transform: scale(.9);
                margin-block: -20px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .door,
            .puff-peek {
                animation: none !important
            }

            .door {
                transform: perspective(900px) rotateY(-16deg)
            }

            .puff-peek {
                opacity: 1;
                transform: translateX(-8px)
            }

            .hint {
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

<body>
    <main class="page" id="page">
        <section class="stage">
            <div class="scene" id="scene" role="button" tabindex="0" aria-label="轻轻点一下门，进入下一页">
                <div class="inside"></div>

                <!-- 半开门状态：独立于 .inside，直接作为 .scene 的图层 -->
                <div class="puff-peek" aria-hidden="true">
                    <img class="puff-peek-img" src="Puff_lean.png" alt="泡芙探头">
                </div>

                <!-- 完全开门状态：同样独立于 .inside -->
                <div class="puff-open" aria-hidden="true">
                    <img class="puff-open-img" src="Puff_inside.png" alt="泡芙在门内">
                </div>

                <div class="door"><span class="knob"></span></div>
                <div class="frame"></div>
            </div>
            <p class="hint" id="hint">轻轻点一下门</p>
        </section>
    </main>
    <script>
        const scene = document.getElementById('scene');
        const hint = document.getElementById('hint');
        const page = document.getElementById('page');
        const door = scene.querySelector('.door');
        let opening = false;

        setTimeout(() => hint.classList.add('show'), 10000);

        function openDoor() {
            if (opening) return;
            opening = true;
            hint.classList.add('show');

            // 先读取点击瞬间门的真实视觉状态。
            const currentTransform = getComputedStyle(door).transform;

            // 停掉循环半开动画，并把点击瞬间的状态固定为新的起点。
            door.style.animation = 'none';
            door.style.transition = 'none';
            door.style.transform = currentTransform === 'none'
                ? 'perspective(900px) rotateY(0deg)'
                : currentTransform;

            // 让浏览器真正提交上面的“起点”。
            void door.offsetWidth;

            // .open 只负责切换 Puff_lean / Puff_inside 等状态。
            scene.classList.add('open');

            // 门本身由 inline transition 从当前角度继续开到 -72deg。
            door.style.transition = 'transform .9s cubic-bezier(.22, .75, .18, 1)';

            requestAnimationFrame(() => {
                door.style.transform = 'perspective(900px) rotateY(-72deg)';
            });

            setTimeout(() => page.classList.add('leaving'), 2200);
            setTimeout(() => location.href = 'page2.html', 2900);
        }

        scene.addEventListener('click', openDoor);
        scene.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openDoor();
            }
        });
    </script>
</body>

</html>
