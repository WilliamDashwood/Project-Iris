<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>泡芙在门后</title>
    <style>
        :root {
            --bg: #f6efe6;
            --line: #6f4c38;
            --door: #ead2bd;
            --frame: #d7b398;
            --ink: #8a6954
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%
        }

        body {
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--line);
            background: radial-gradient(circle at 20% 18%, rgba(255, 255, 255, .6), transparent 24%), linear-gradient(145deg, #f7f0e8, #efe3d5)
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            opacity: .18;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(111, 76, 56, .02) 0 1px, transparent 1px 4px)
        }

        .page {
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            transition: .65s
        }

        .page.leaving {
            opacity: 0;
            transform: scale(1.025)
        }

        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-1vh)
        }

        .scene {
            position: relative;
            width: 300px;
            height: 430px;
            cursor: pointer;
            filter: drop-shadow(0 18px 22px rgba(91, 61, 42, .14));
            -webkit-tap-highlight-color: transparent
        }

        .inside {
            position: absolute;
            z-index: 1;
            left: 26px;
            top: 25px;
            width: 248px;
            height: 382px;
            border: 5px solid var(--line);
            border-radius: 130px 130px 16px 16px;
            overflow: hidden;
            background: radial-gradient(circle at 72% 36%, rgba(255, 245, 205, .95), transparent 33%), linear-gradient(160deg, #cda98d, #8b674f)
        }

        /* 半开门：Puff_lean.png。
           作为 .scene 的直属图层。图层顺序按需求设置为：
           门板在上，Puff_lean 居中，门框在下。 */
        .puff-peek {
            position: absolute;
            left: 174px;
            top: 220px;
            width: 142px;
            height: 118px;
            overflow: hidden;
            z-index: 5;
            opacity: 0;
            transform: translateX(-88px);
            clip-path: inset(0 0 0 100%);
            animation: peek 5s ease-in-out infinite;
            pointer-events: none;
        }

        .puff-peek-img {
            position: absolute;
            width: 300px;
            max-width: none;
            left: -94px;
            top: -55px;
            display: block;
            transform: rotate(20deg);
            transform-origin: center center;
        }

        /* 完全开门：独立图层，直接相对 .scene 定位 */
        .puff-open {
            position: absolute;
            left: 26px;
            top: 25px;
            width: 248px;
            height: 382px;
            overflow: hidden;
            border-radius: 130px 130px 16px 16px;
            z-index: 2;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .puff-open-img {
            position: absolute;
            width: 290px;
            max-width: none;
            left: -20px;
            top: 6px;
            transform: translateY(48%);
            display: block;
        }

.door {
            position: absolute;
            left: 31px;
            top: 30px;
            width: 238px;
            height: 372px;
            z-index: 6;
            transform-origin: left center;
            border: 5px solid var(--line);
            border-radius: 122px 122px 13px 13px;
            background: linear-gradient(90deg, rgba(255, 255, 255, .18), transparent 28%), var(--door);
            animation: doorpeek 5s ease-in-out infinite;
            backface-visibility: hidden
        }

        .door:before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 4px solid rgba(111, 76, 56, .78);
            border-radius: 104px 104px 9px 9px
        }

        .knob {
            position: absolute;
            right: 19px;
            top: 53%;
            width: 17px;
            height: 17px;
            border: 3px solid var(--line);
            border-radius: 50%;
            background: #c58d65
        }

        .frame {
            position: absolute;
            inset: 0;
            border: 6px solid var(--line);
            border-radius: 155px 155px 20px 20px;
            box-shadow: inset 0 0 0 13px var(--frame), inset 0 0 0 18px var(--line);
            pointer-events: none;
            z-index: 4
        }

        .hint {
            margin: 24px 0 0;
            min-height: 36px;
            padding: 4px 12px 7px;
            font-size: clamp(18px, 4.8vw, 22px);
            letter-spacing: .12em;
            color: var(--ink);
            opacity: 0;
            transform: translateY(8px);
            transition: .75s;
            position: relative
        }

        .hint.show {
            opacity: 1;
            transform: none
        }

        .hint:after {
            content: "";
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: 0;
            height: 2px;
            background: rgba(111, 76, 56, .18);
            border-radius: 99px
        }

        @keyframes doorpeek {
            0% {
                transform: perspective(900px) rotateY(0)
            }

            8%,
            50% {
                transform: perspective(900px) rotateY(-18deg)
            }

            60%,
            100% {
                transform: perspective(900px) rotateY(0)
            }
        }

        @keyframes peek {

            0%,
            8% {
                opacity: 0;
                transform: translateX(-88px);
                clip-path: inset(0 0 0 100%)
            }

            18%,
            50% {
                opacity: 1;
                transform: translateX(0);
                clip-path: inset(0 0 0 50%)
            }

            60%,
            100% {
                opacity: 0;
                transform: translateX(-88px);
                clip-path: inset(0 0 0 100%)
            }
        }

        .scene.open .door {
            animation: none;
            transition: transform .9s cubic-bezier(.22, .75, .18, 1);
            transform: perspective(900px) rotateY(-72deg)
        }

        .scene.open .puff-peek {
            animation: none;
            opacity: 0;
            transform: translateX(-28px);
            clip-path: inset(0 0 0 100%);
            transition: opacity .15s ease, transform .2s ease, clip-path .2s ease;
        }

        .scene.open .puff-open {
            visibility: visible;
            opacity: 1;
            transition: none;
        }
@media(max-width:430px) {
            .scene {
                transform: scale(.9);
                margin-block: -20px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .door,
            .puff-peek {
                animation: none !important
            }

            .door {
                transform: perspective(900px) rotateY(-16deg)
            }

            .puff-peek {
                opacity: 1;
                transform: none;
                clip-path: inset(0 0 0 50%)
            }

            .hint {
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

<body>
    <main class="page" id="page">
        <section class="stage">
            <div class="scene" id="scene" role="button" tabindex="0" aria-label="轻轻点一下门，进入下一页">
                <div class="inside"></div>

                <!-- 半开门状态：独立于 .inside，直接作为 .scene 的图层 -->
                <div class="puff-peek" aria-hidden="true">
                    <img class="puff-peek-img" src="Puff_lean.png" alt="泡芙探头">
                </div>

                <!-- 完全开门状态：同样独立于 .inside -->
                <div class="puff-open" aria-hidden="true">
                    <img class="puff-open-img" src="Puff_inside.png" alt="泡芙在门内">
                </div>

                <div class="door"><span class="knob"></span></div>
                <div class="frame"></div>
            </div>
            <p class="hint" id="hint">轻轻点一下门</p>
        </section>
    </main>
    <script>
        const scene = document.getElementById('scene'), hint = document.getElementById('hint'), page = document.getElementById('page'); let opening = false; setTimeout(() => hint.classList.add('show'), 10000); function openDoor() { if (opening) return; opening = true; hint.classList.add('show'); scene.classList.add('open'); setTimeout(() => page.classList.add('leaving'), 2200); setTimeout(() => location.href = 'page2.html', 2900) } scene.addEventListener('click', openDoor); scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDoor() } });
    </script>
</body>

</html>
